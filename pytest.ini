; `git-skills test` runs pytest over tests/. Each test module is imported
; by its path, so two skills' tests may share a file name; `skill_scripts`
; (in tests/) and `git_skills` (in scripts/) import by name.
[pytest]
addopts = --import-mode=importlib -p no:cacheprovider
pythonpath = tests scripts
python_files = test_*.py
testpaths = tests
